<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#fff;min-height:100vh;padding:14px}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:1.2rem;margin:4px 0 14px}
  label{display:block;font-size:.8rem;color:#94a3b8;margin:6px 0 3px}
  input,select{width:100%;padding:12px;font-size:1rem;border:0;border-radius:10px;margin-bottom:6px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button{width:100%;padding:14px;font-size:1rem;border:0;border-radius:10px;background:#14b8a6;color:#04201d;font-weight:700;margin-top:6px}
  button.red{background:#ef4444;color:#fff}
  #reader{border-radius:14px;overflow:hidden;background:#000;margin-top:8px}
  #result{margin-top:12px;padding:16px;border-radius:14px;text-align:center;font-size:1rem;min-height:84px;background:#1e293b}
  #result b{display:block;font-size:1.3rem;margin-bottom:2px}
  .ok{background:#166534!important}.late{background:#b45309!important}.dup{background:#a16207!important}.bad{background:#991b1b!important}
  .row{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;color:#94a3b8;font-size:.9rem}
  #list{list-style:none;padding:0;margin:0;max-height:200px;overflow:auto}
  #list li{padding:8px 10px;border-bottom:1px solid #1e293b;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
  #report{margin-top:12px;background:#1e293b;border-radius:14px;padding:14px;display:none}
  #report ul{padding-left:18px;margin:6px 0 0}
  #err{color:#fca5a5;margin-top:8px;min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <h1>Attendance Scanner</h1>
  <div id="login">
    <label>Class / course</label>
    <input id="cls" placeholder="e.g. Networking 101">
    <div class="two">
      <div><label>Class start time</label><input id="start" type="time"></div>
      <div><label>Late after (minutes)</label><input id="grace" type="number" value="10" min="0"></div>
    </div>
    <label>PIN</label>
    <input id="pin" type="password" placeholder="PIN">
    <button onclick="login()">Start scanning</button>
    <div id="err"></div>
  </div>
  <div id="app" style="display:none">
    <select id="mode"><option value="in">Check-in</option><option value="out">Check-out</option></select>
    <div id="reader"></div>
    <div id="result">Point the camera at a student's QR</div>
    <div class="row"><span>In: <b id="n">0</b> &nbsp; Late: <b id="nl">0</b></span><span id="clsLabel"></span></div>
    <ul id="list"></ul>
    <button class="red" onclick="endClass()">End class &amp; mark absent</button>
    <div id="report"></div>
  </div>
</div>
<script>
  // >>> PUT YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) <<<
  var API_URL = 'https://script.google.com/macros/s/AKfycbwfClZjmTKetOK0FIkM2y5OOGhWHxH5H4menzw7Z2TTEX0alLXJ3ChAWRAqGlkKvL-RXg/exec';

  var PIN = '', CLS = '', START = '', GRACE = 10, busy = false, lastCode = '', lastTime = 0, cIn = 0, cLate = 0, scanner = null;
  var $ = function(i){return document.getElementById(i)};

  function api(body){
    body.pin = PIN;
    return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)})
      .then(function(r){return r.json()});
  }

  function login(){
    PIN = $('pin').value; CLS = $('cls').value.trim() || 'Class';
    START = $('start').value; GRACE = Number($('grace').value) || 0;
    $('err').textContent = 'Checking...';
    api({action:'login'}).then(function(r){
      if(!r.ok){ $('err').textContent = r.msg || 'Failed'; return; }
      $('login').style.display='none'; $('app').style.display='block';
      $('clsLabel').textContent = CLS + (START ? ' - ' + START : '');
      startCam();
    }).catch(function(){ $('err').textContent = 'Cannot reach server. Check API_URL.'; });
  }

  function startCam(){
    scanner = new Html5Qrcode('reader');
    scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}}, onScan, function(){})
      .catch(function(){ show('bad','Camera error','Allow camera access and use https'); });
  }

  function beep(ok){
    try{
      var c = new (window.AudioContext||window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
      o.frequency.value = ok ? 880 : 220; g.gain.value = .15; o.connect(g); g.connect(c.destination);
      o.start(); setTimeout(function(){o.stop();c.close()}, ok?120:300);
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate(ok?60:[120,60,120]);
  }

  function show(cls, title, sub){
    var r = $('result'); r.className = cls;
    r.innerHTML = '<b></b><span></span>';
    r.firstChild.textContent = title; r.lastChild.textContent = sub || '';
  }

  function onScan(text){
    var now = Date.now();
    if(busy || (text === lastCode && now - lastTime < 4000)) return;
    busy = true; lastCode = text; lastTime = now;
    show('', 'Checking...', '');
    api({action:'scan', code:text, cls:CLS, mode:$('mode').value, start:START, grace:GRACE}).then(function(r){
      if(r.ok){
        var isLate = r.status === 'Late';
        if(r.mode === 'Check-in'){ cIn++; if(isLate) cLate++; $('n').textContent = cIn; $('nl').textContent = cLate; }
        beep(true);
        var detail = r.id + ' - ' + r.mode + ' ' + r.time + (isLate ? ' - LATE ' + r.late + ' min' : (r.mode === 'Check-in' ? ' - On time' : ''));
        show(isLate ? 'late' : 'ok', r.name, detail);
        var li = document.createElement('li');
        li.innerHTML = '<span></span><span></span>';
        li.firstChild.textContent = r.name + (isLate ? ' (late)' : '') + (r.mode === 'Check-out' ? ' (out)' : '');
        li.lastChild.textContent = r.time;
        $('list').insertBefore(li, $('list').firstChild);
      } else if(r.dup){
        beep(false); show('dup', r.name || 'Duplicate', r.msg);
      } else {
        beep(false); show('bad', 'Rejected', r.msg);
      }
    }).catch(function(){
      show('bad', 'Network error', 'Scan again');
    }).then(function(){ setTimeout(function(){busy=false}, 800); });
  }

  function endClass(){
    if(!confirm('End class and mark all students without a check-in as Absent?')) return;
    var rep = $('report'); rep.style.display = 'block'; rep.textContent = 'Working...';
    api({action:'close', cls:CLS}).then(function(r){
      if(!r.ok){ rep.textContent = r.msg || 'Failed'; return; }
      rep.innerHTML = '';
      var h = document.createElement('div');
      h.textContent = 'Present: ' + r.present + ' / ' + r.total + '   Late: ' + r.late + '   Absent: ' + r.absent.length;
      rep.appendChild(h);
      if(r.absent.length){
        var ul = document.createElement('ul');
        r.absent.forEach(function(s){ var li = document.createElement('li'); li.textContent = s.name + ' (' + s.id + ')'; ul.appendChild(li); });
        rep.appendChild(ul);
      }
      if(scanner){ scanner.stop().catch(function(){}); }
    }).catch(function(){ rep.textContent = 'Network error. Try again.'; });
  }
</script>
</body>
</html>
